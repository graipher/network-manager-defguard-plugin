name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libnm-dev libgtk-3-dev libgtk-4-dev clang-format
      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"
          clang-format --dry-run --Werror properties/*.c
      - name: Lint
        run: |
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Build and test
        run: make test CFLAGS='-O2 -Wall -Wextra -Werror'
