name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libnm-dev libgtk-3-dev libgtk-4-dev clang-format
      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"
          clang-format --dry-run --Werror properties/*.c
      - name: Lint
        run: go vet ./...
      - name: Build and test
        run: make test CFLAGS='-O2 -Wall -Wextra -Werror'
