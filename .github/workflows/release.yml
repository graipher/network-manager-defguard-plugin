name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libnm-dev libgtk-3-dev libgtk-4-dev clang-format
      - name: Check, build, and test
        run: |
          test -z "$(gofmt -l .)"
          clang-format --dry-run --Werror properties/*.c
          go vet ./...
          make test CFLAGS='-O2 -Wall -Wextra -Werror'
      - name: Build Debian package
        run: |
          packaging/build-deb.sh "${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum *.deb > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
