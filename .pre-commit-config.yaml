repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        files: ^properties/.*\.c$
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        files: \.go$
        pass_filenames: false
      - id: govulncheck
        name: govulncheck
        entry: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
        language: system
        files: (^go\.(mod|sum)$|\.go$)
        pass_filenames: false
      - id: test
        name: build and test
        entry: make test
        language: system
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: zizmor .github/
        language: python
        additional_dependencies: [zizmor==1.18.0]
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
